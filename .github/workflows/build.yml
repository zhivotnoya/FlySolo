name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer (errors fail the build)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

      - name: Python compiles
        run: python -m py_compile widget/guard_widget.py

  build:
    needs: lint
    runs-on: windows-latest
    permissions:
      contents: write   # to attach files to a release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build widget exe
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pystray pillow
          python -m PyInstaller --onefile --noconsole --name FlySoloWidget widget/guard_widget.py

      - name: Package release zip
        shell: pwsh
        run: |
          $pkg = 'package/FlySolo'
          New-Item -ItemType Directory $pkg -Force | Out-Null
          Copy-Item install.ps1, uninstall.ps1, guard.ps1, README.md, LICENSE $pkg
          Copy-Item dist/FlySoloWidget.exe $pkg
          Compress-Archive -Path "$pkg/*" -DestinationPath FlySolo.zip -Force
          (Get-FileHash FlySolo.zip -Algorithm SHA256).Hash + '  FlySolo.zip' |
            Out-File FlySolo.zip.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: FlySolo
          path: |
            FlySolo.zip
            FlySolo.zip.sha256

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FlySolo.zip
            FlySolo.zip.sha256
